services:
  agent:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs

  ui:
    build: .
    entrypoint: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
